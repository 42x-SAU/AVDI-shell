services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: diag
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d diag"]
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 40s

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: .
      dockerfile: docker/server.Dockerfile
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_NAME: diag
      DB_SSLMODE: disable
      REDIS_URL: redis://redis:6379
      WEBSOCKET_ENABLED: "true"
      MAX_CONCURRENT_TASKS_PER_AGENT: "3"
      BASE_RETRY_DELAY_SECONDS: "30"
      MAX_RETRY_DELAY_SECONDS: "3600"
      SERVER_ADDR: :8080
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8081:8080"

  agent:
    build:
      context: .
      dockerfile: docker/agent.Dockerfile
    environment:
      SERVER_URL: http://server:8080
      AGENT_NAME: demo-agent
      REDIS_URL: redis://redis:6379
      WEBSOCKET_ENABLED: "true"
    depends_on:
      - server
      - redis

volumes:
  pgdata: