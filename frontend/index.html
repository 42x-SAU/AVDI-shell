<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <!-- Ранняя установка data-theme до React, чтобы снизить мигание цветов -->
    <script>
      (function () {
        try {
          var k = 'avdi-shell-theme'
          var v = localStorage.getItem(k)
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches
          if (v === 'dark') document.documentElement.setAttribute('data-theme', 'dark')
          else if (v === 'light') document.documentElement.setAttribute('data-theme', 'light')
          else document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light')
        } catch (e) {}
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geologica:wght,CRSV@100..900,0&display=swap"
      rel="stylesheet"
    />
    <link href="https://fonts.googleapis.com/css2?family=Jura:wght@300..700&display=swap" rel="stylesheet" />
    <link rel="icon" href="/favicon.ico" sizes="32x32" type="image/x-icon" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AVDI Shell — веб-интерфейс внутренней диагностики инфраструктуры" />
    <title>AVDI Shell</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
